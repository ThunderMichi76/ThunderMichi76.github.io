<style>
:root{--bg:#f7f6f3;--card:#fff;--fg:#1d2321;--mut:#7a827e;--line:#e6e4de;--ac:#3d6b5c;--on:#fff}

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

.tl li.now{color:var(--fg);font-weight:600}.tl li.now:before{background:var(--ac)}.tl b{min-width:44px;font-weight:500}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0}.x{border:0;background:none;font-size:1.3rem;color:var(--mut);padding:4px 10px}

.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--line)}.dot.valid{background:var(--ac)}.dot.saved{border:2px dashed var(--ac);background:none}.dot.miss{background:var(--mut);opacity:.5}

/* ===== v2: sistema de diseño, menú lateral, panel ===== */
:root{--ok:#2f9e6b;--warn:#d9922b;--err:#d1495b;--sw:76px;--sh:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);--font:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
:root[data-theme=light]{--bg:#f7f6f3;--card:#fff;--fg:#1d2321;--mut:#7a827e;--line:#e6e4de;--ac:#3d6b5c;--on:#fff}
:root[data-theme=dark]{--bg:#121413;--card:#1b1d1c;--fg:#e8ebe9;--mut:#8b9490;--line:#2b2f2d;--ac:#7fb3a0;--on:#10201a}
body{font-family:var(--font);padding-left:var(--sw)}
main{max-width:980px;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card{box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}@media(hover:hover){.card:hover{transform:translateY(-1px)}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
aside{position:fixed;left:0;top:0;bottom:0;width:var(--sw);display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line);z-index:5}
aside .top{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:center}
.ib{border:1px solid var(--line);background:none;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--fg)}
#days{flex:1;overflow-y:auto;padding:6px}
.day{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;min-height:44px;border:1px solid transparent;border-radius:12px;background:none;margin-bottom:2px;font-size:.8rem;color:var(--mut);transition:background .15s}
.day b{font-weight:600;color:var(--fg)}.day em,.s3{display:none;font-style:normal}
.day:hover{background:var(--bg)}.day.sel{background:var(--ac);color:var(--on)}.day.sel b{color:var(--on)}.day.today:not(.sel){border-color:var(--ac)}
.day i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mut);flex:none}
.day i.valid{background:var(--ok);border-color:var(--ok)}.day i.part{background:var(--warn);border-color:var(--warn)}.day i.saved{border:1.5px dashed var(--ac)}.day i.miss{background:var(--mut);opacity:.5}
.day.sel i{box-shadow:0 0 0 2px var(--on)}
@media(min-width:760px){:root{--sw:176px}.day{justify-content:flex-start;padding:0 12px}.day em,.s3{display:inline}.s1{display:none}.day i{margin-left:auto}}
nav{left:var(--sw)}nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;font-size:.75rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kpi{margin:0;display:flex;flex-direction:column;gap:2px}.kpi b{font-size:1.7rem;font-weight:600}
.up{color:var(--ok)}.dn{color:var(--err)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.grid .card{margin:0}.wide{grid-column:1/-1}
.cv{position:relative;height:230px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;overflow-x:auto;padding:3px}.hm i{border-radius:3px}
@media(max-width:759px){main{padding:14px 10px 100px}.head h2{font-size:1rem}.cell{width:25px;height:25px;border-radius:7px}td:first-child{max-width:62px;font-size:.72rem}td,th{padding:3px 1px}}

/* ===== v3: estética tipo app iOS (inspirada en Strides) ===== */
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;--r:20px;--sh:none}
:root[data-theme=light]{--bg:#F2F2F7;--card:#fff;--fg:#1C1C1E;--mut:#8E8E93;--line:rgba(60,60,67,.14);--ac:#0A84FF;--on:#fff}
:root[data-theme=dark]{--bg:#000;--card:#1C1C1E;--fg:#fff;--mut:#98989F;--line:rgba(255,255,255,.14);--ac:#0A84FF;--on:#fff}
.card{border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);padding:18px}
h2{font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 12px}.sh h2{margin:0}
.btn,.pill{border-radius:999px;transition:transform .2s,background .2s}.btn:active,.pill:active{transform:scale(.97)}

.chip{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.goal{margin:0;display:flex;flex-direction:column;gap:10px}
.gh{display:flex;gap:12px;align-items:center}.gh b{display:block}.gh small{margin:0}
.gn{font-size:2.2rem;font-weight:700;line-height:1;letter-spacing:-.02em}.gn .muted{font-size:1rem;font-weight:500}
.bar{height:8px}.bar div{background:var(--c,var(--ac));animation:fill .8s cubic-bezier(.2,.8,.2,1);transition:width .3s}@keyframes fill{from{width:0}}
.gf{display:flex;align-items:center;gap:10px}.fl{display:flex;align-items:center;gap:4px;color:#FF9F0A;font-weight:600}.fl svg{width:16px;height:16px}.sp{width:70px;height:20px;margin-left:auto}
.kpi b{color:var(--c,var(--fg))}.seg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.seg>span{font-weight:600}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== INTRO · CSS (pegar al final del <style>) ===== */
:root{--intro-accent:var(--ac);--ease:cubic-bezier(.22,1,.36,1)}
#intro{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:var(--font);cursor:default;
 transition:opacity .6s var(--ease),transform .6s var(--ease);animation:i-failsafe 0s 6s forwards}
#intro.out{opacity:0;transform:scale(1.04);pointer-events:none}
#intro .logo{width:88px;height:88px;overflow:visible;animation:i-pop calc(.8s*var(--k,1)) var(--ease) backwards}                         /* 0.0-0.8 s icono */
#intro .arc{fill:none;stroke:var(--intro-accent);stroke-width:7;stroke-linecap:round;stroke-dasharray:73 100}
#intro .rg{display:none;fill:none;stroke:var(--intro-accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:100 100}
#intro h1{margin:22px 0 4px;font-size:1.9rem;font-weight:700;letter-spacing:-.02em;animation:i-up calc(.8s*var(--k,1)) calc(.6s*var(--k,1)) var(--ease) backwards}   /* 0.6-1.4 s nombre */
#intro p{margin:0;color:var(--mut);animation:i-up calc(.8s*var(--k,1)) calc(.75s*var(--k,1)) var(--ease) backwards}
#intro .ibar{width:120px;height:2px;margin-top:36px;border-radius:2px;background:var(--line);overflow:hidden;animation:i-fade calc(.5s*var(--k,1)) calc(.9s*var(--k,1)) backwards}
#intro .ibar i{display:block;height:100%;background:var(--intro-accent);transform-origin:left;animation:i-fill calc(.8s*var(--k,1)) calc(1.2s*var(--k,1)) var(--ease) backwards}   /* 1.2-2.0 s barra */
/* botón Entrar: usa el estilo .btn de la web; aparece al terminar la animación (3 s) */
#intro[data-mode=auto]{cursor:pointer}#intro[data-mode=auto] .enter{display:none}
#intro .enter{margin-top:28px;padding:12px 26px;display:inline-flex;align-items:center;gap:8px;font-weight:600;visibility:hidden;opacity:0;transition:transform .2s,filter .2s}
#intro .enter.show{visibility:visible;opacity:1;animation:i-fade .6s var(--ease) backwards,i-pulse 2.8s ease-in-out .8s infinite}   /* fade-in + pulso discreto */
#intro .enter:hover{filter:brightness(1.08)}#intro .enter svg{width:18px;height:18px;transition:transform .2s}#intro .enter:hover svg{transform:translateX(3px)}
@keyframes i-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 35%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
@keyframes i-pop{from{opacity:0;transform:scale(.9)}}@keyframes i-up{from{opacity:0;transform:translateY(12px)}}
@keyframes i-fade{from{opacity:0}}@keyframes i-fill{from{transform:scaleX(0)}}@keyframes i-failsafe{to{opacity:0;visibility:hidden;pointer-events:none}}
/* variantes: data-variant="draw" | "ring" | "blur" en <div id="intro"> */
#intro[data-variant=draw] .logo{animation:none}#intro[data-variant=draw] .arc{animation:i-draw calc(.9s*var(--k,1)) var(--ease) backwards}@keyframes i-draw{from{stroke-dashoffset:73}}
#intro[data-variant=ring] .ibar{display:none}#intro[data-variant=ring] .rg{display:block;animation:i-ring calc(.8s*var(--k,1)) calc(1.2s*var(--k,1)) var(--ease) backwards}@keyframes i-ring{from{stroke-dashoffset:100}}
#intro[data-variant=blur] .logo,#intro[data-variant=blur] .ibar{display:none}#intro[data-variant=blur] h1{font-size:2.4rem;animation:i-blur calc(1.1s*var(--k,1)) var(--ease) backwards}@keyframes i-blur{from{opacity:0;filter:blur(14px)}}
/* la web queda oculta bajo la intro y entra con fade-in; el scroll se bloquea mientras tanto */
html.intro-on aside,html.intro-on main,html.intro-on nav{opacity:0;visibility:hidden}
aside,main,nav{transition:opacity .6s var(--ease)}
html.intro-on,html.intro-on body{overflow:hidden}main:focus{outline:none}

<!-- ===== INTRO · HTML (pegar justo después de <body>) ===== -->
<div id="intro" role="dialog" aria-modal="true" aria-label="Pantalla de inicio" data-variant="">
 <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><circle class="rg" cx="50" cy="50" r="48" pathLength="100" transform="rotate(-90 50 50)"/><circle class="arc" cx="50" cy="50" r="24" pathLength="100" transform="rotate(-70 50 50)"/></svg>
 <h1>Winter Arc</h1><p>Tu progreso, día a día</p>
 <div class="ibar" aria-hidden="true"><i></i></div>
 <button type="button" id="intro-enter" class="btn enter"><span>Entrar</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
 <noscript><style>#intro{display:none!important}</style></noscript>
</div>
<script>
/* ===== INTRO · JS (pegar justo después del HTML de la intro, antes del resto) ===== */
(()=>{
/* ---- AJUSTES ---- */
const INTRO_MODE="button";        // "button" = solo se cierra con Entrar · "auto" = se cierra sola · "both" = sola tras INTRO_BOTH_CLOSE_MS o antes con Entrar
const INTRO_AUTO_CLOSE_MS=4000;   // modo "auto": ms hasta cerrar (la animación dura ~3000)
const INTRO_BOTH_CLOSE_MS=8000;   // modo "both": cierre automático largo
const INTRO_BUTTON_TEXT="Entrar"; // etiqueta del botón
const SHOW_INTRO_ALWAYS=true;     // true = en cada carga; false = solo la primera visita de la sesión
const INTRO_SPEED=1.5;            // 1.5 = animación de 3 s; 1 = 2 s; 2 = 4 s
/* ---- FIN AJUSTES ---- */
const R=document.documentElement,el=document.getElementById('intro'),btn=document.getElementById('intro-enter');
try{R.dataset.theme=localStorage.getItem('winterarc:theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}
let seen=false;try{seen=!SHOW_INTRO_ALWAYS&&sessionStorage.getItem('wa-intro')==='1';sessionStorage.setItem('wa-intro','1')}catch(e){}
if(seen){el.remove();return}
const mode=['button','auto','both'].includes(INTRO_MODE)?INTRO_MODE:'button',reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
el.style.animation='none';el.dataset.mode=mode;                 // desactiva el seguro CSS: el script ha arrancado bien
btn.querySelector('span').textContent=INTRO_BUTTON_TEXT;btn.setAttribute('aria-label',INTRO_BUTTON_TEXT+' a Winter Arc');
R.style.setProperty('--k',INTRO_SPEED);R.classList.add('intro-on');   // bloquea el scroll y oculta la web
let done=false,shown=false,tA,tB;
const finish=()=>{if(done)return;done=true;clearTimeout(tA);clearTimeout(tB);removeEventListener('keydown',onKey);
 R.classList.remove('intro-on');el.classList.add('out');el.setAttribute('aria-hidden','true');   // la web entra con fade-in
 setTimeout(()=>{el.remove();const m=document.querySelector('main');if(m){m.tabIndex=-1;m.focus({preventScroll:true})}},600)};
const onKey=e=>{if(mode==='auto'||(shown&&(e.key==='Enter'||e.key===' ')))finish()};
const show=()=>{if(done||mode==='auto')return;shown=true;btn.classList.add('show');btn.focus({preventScroll:true})};
if(mode!=='auto')reduce?show():(tA=setTimeout(show,2000*INTRO_SPEED));   // el botón aparece al terminar la animación
if(mode==='auto')tB=setTimeout(finish,INTRO_AUTO_CLOSE_MS);
if(mode==='both')tB=setTimeout(finish,INTRO_BOTH_CLOSE_MS);
btn.addEventListener('click',finish);if(mode==='auto')el.addEventListener('click',finish);addEventListener('keydown',onKey);
})();
</script>

 minimum:[{id:'med',n:'Meditación'},{id:'study',n:'20 min de estudio'},{id:'walk',n:'Paseo'},{id:'bed',n:'Cama a la hora'}],
 causes:['amigos','vídeos','otra app','cansancio','otro'],
 exercises:['Dominadas con lastre','Fondos con lastre'],
 defaults:{start:'2026-10-12',adaptEnd:'2026-10-14',end:'2026-12-31',shortsWk:60,shortsWe:90,validMin:8,relapse:6,
  win:'Semana ganada: ruta larga en bici el sábado + capricho',lose:'Pendiente: 45 min extra de estudio el domingo'},
 // Horas de sábado y domingo: orientativas, ajústalas.
 schedule:{
  wk:[
   {t:'06:30',x:'Despertar, agua, móvil lejos de la cama'},
   {t:'06:35',x:'Meditación 10 min',a:'Meditación 5 min'},
   {t:'06:45',x:'Desayuno proteico (huevos, avena, leche, fruta) y preparar'},

   {t:'08:15',x:'Instituto (móvil guardado, YouTube bloqueado)'},
   {t:'14:45',x:'Vuelta a casa y comida (llego sobre las 15:30)'},
   {t:'16:15',x:'Estudio, bloque 1 (45 min, móvil en otra habitación)'},
   {t:'17:05',x:'Estudio, bloque 2 (40 min; sin tareas, repaso)'},
   {t:'17:45',x:'Ir al parque a pie'},
   {t:'18:00',x:'Entreno (calistenia, 1-1,5 h)'},
   {t:'19:30',x:'Vuelta, ducha, cena (cena a las 20:30)'},
   {t:'21:00',x:'Finanzas 25 min (resumen de una página por semana)'},
   {t:'21:25',x:'Paseo de 30 min y mensajes con amigos'},
   {t:'21:55',x:'Preparar mañana (ropa, 3 tareas) y móvil fuera del cuarto'},
   {t:'22:15',x:'Cama sin pantalla (leer 10 min)'},
   {t:'22:30',x:'Dormir'}],
  sat:[
   {t:'08:00',x:'Levantarse como máximo, meditación',a:'Levantarse como máximo, meditación 5 min'},
   {t:'09:30',x:'Ruta larga en bici (resistencia)'},
   {t:'17:00',x:'Finanzas'},
   {t:'21:25',x:'Paseo'},
   {t:'22:30',x:'Cama'}],
  sun:[
   {t:'08:30',x:'Meditación y descanso activo',a:'Meditación 5 min y descanso activo'},
   {t:'11:00',x:'1 bloque de estudio'},

};

<script>
(()=>{
const TZ='Europe/Madrid',KEY='winterarc:v1',C=CONFIG,PU='Dominadas con lastre';
const $=(s)=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const norm=()=>{S.settings=Object.assign({},C.defaults,S.settings);S.days=S.days||{};S.weeks=S.weeks||{}};norm();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('No se pudo guardar. Exporta una copia.')}};
// ---- fechas (zona Europe/Madrid, semana en lunes)
const nowD=()=>new Date().toLocaleDateString('sv-SE',{timeZone:TZ});
const nowT=()=>new Date().toLocaleTimeString('sv-SE',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
const dt=s=>new Date(s+'T12:00:00Z');
const add=(s,n)=>{const d=dt(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dow=s=>(dt(s).getUTCDay()+6)%7;
const monday=s=>add(s,-dow(s));
const diff=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
const DN=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const fmt=s=>dt(s).toLocaleDateString('es-ES',{timeZone:'UTC',day:'numeric',month:'long'});
// ---- datos y reglas
const D=s=>S.days[s]||{},W=s=>S.days[s]||(S.days[s]={});
const st_=()=>S.settings;
const phase=s=>s<st_().start?'Previa':s<=st_().adaptEnd?'Adaptación':s<=st_().end?'Sistema completo':'Reto terminado';
const habitsFor=s=>phase(s)==='Adaptación'?C.habits.filter(h=>h.adapt):C.habits;
const lim=s=>dow(s)<5?st_().shortsWk:st_().shortsWe;
const score=s=>{const h=D(s).h||{};return habitsFor(s).reduce((a,x)=>a+(h[x.id]?x.p:0),0)};
const maxS=s=>habitsFor(s).reduce((a,x)=>a+x.p,0);
const thr=s=>phase(s)==='Adaptación'?maxS(s):st_().validMin;
const minOk=s=>{const d=D(s);return !!d.min&&C.minimum.every(m=>d.m&&d.m[m.id])};
const status=s=>{const t=nowD();if(s>t||(s<t&&!Object.keys(D(s)).length))return'empty';
 if(score(s)>=thr(s))return'valid';if(minOk(s))return'saved';return s===t?'open':'miss'};
const inCh=s=>s>=st_().start&&s<=st_().end;
const bedOk=v=>v>='12:00'&&v<='22:30';
function auto(s,f){const o=W(s);o.h=o.h||{};
 if(f==='steps'&&o.steps!=='')o.h.steps=o.steps>=10000;
 if(f==='shorts'&&o.shorts!=='')o.h.shorts=o.shorts<=lim(s);
 if(f==='bed'&&o.bed)o.h.bed=bedOk(o.bed)}
const tog=(s,k,id)=>{const o=W(s);o[k]=o[k]||{};o[k][id]=!o[k][id];save()};
const bestPU=ds=>{let b=null;ds.forEach(d=>(D(d).wo||[]).forEach(w=>{if(w.e===PU&&(!b||w.kg>b.kg||(w.kg===b.kg&&w.r>b.r)))b=w}));return b};
function wstats(ds){const t=nowD(),a=ds.filter(d=>inCh(d)&&d<=t);
 const sh=a.map(d=>D(d).shorts).filter(v=>v!==undefined&&v!=='');
 const causes={};a.forEach(d=>{const o=D(d);if(!o.min&&habitsFor(d).some(h=>h.study&&!(o.h&&o.h[h.id]))&&o.why&&o.why.cause)causes[o.why.cause]=(causes[o.why.cause]||0)+1});
 return{valid:a.filter(d=>status(d)==='valid').length,saved:a.filter(d=>status(d)==='saved').length,
  study:a.reduce((n,d)=>n+(D(d).h&&D(d).h.s1?1:0)+(D(d).h&&D(d).h.s2?1:0),0),
  avg:sh.length?Math.round(sh.reduce((x,y)=>x+y,0)/sh.length):null,pu:bestPU(a),
  bed:a.filter(d=>D(d).h&&D(d).h.bed).length,causes,
  alert:ds.some((d,i)=>i<6&&d<t&&ds[i+1]<t&&inCh(d)&&inCh(ds[i+1])&&Object.keys(D(d)).length&&Object.keys(D(ds[i+1])).length&&score(d)<st_().relapse&&score(ds[i+1])<st_().relapse)}}
const weekDays=w=>[...Array(7)].map((_,i)=>add(w,i));
// ---- estado de vista
let tab='pro',cur=nowD(),wk=monday(nowD());
const row=(k,id,n,on,c)=>`<button class="row${on?' on':''}" style="--c:${c||'var(--ac)'}" data-act="chk" data-k="${k}" data-id="${id}"><i></i><span>${n}</span></button>`;
const list=s=>{const d=D(s);
 if(d.min)return'<h3>Día mínimo</h3>'+C.minimum.map(m=>row('m',m.id,m.n,d.m&&d.m[m.id])).join('');
 return habitsFor(s).map(h=>row('h',h.id,esc(h.n)+(h.id==='shorts'?` (máx. ${lim(s)} min)`:'')+`<small>${h.p} pt</small>`,d.h&&d.h[h.id],h.c)).join('')};
const head=s=>{const sc=score(s),m=maxS(s),th=thr(s),st=status(s),c=2*Math.PI*34;
 const msg={valid:'Día válido',saved:'Día salvado: el mínimo cuenta',open:`Faltan ${th-sc} punto${th-sc>1?'s':''} para día válido`,miss:'Día flojo',empty:'Sin registro'}[st];
 return`<div class="head"><div><h2>${DN[dow(s)]} ${dt(s).getUTCDate()}</h2><div class="muted">${fmt(s)} · ${phase(s)}</div><span class="pill ${st}">${msg}</span></div>
 <div class="ring"><svg viewBox="0 0 80 80" width="84" height="84"><circle class="bg" cx="40" cy="40" r="34"/><circle class="fg" cx="40" cy="40" r="34" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-(m?sc/m:0))}"/></svg><b>${sc}/${m}</b></div></div>`};
const why=s=>{const o=D(s);if(o.min||phase(s)!=='Sistema completo'||!(s<nowD()||nowT()>='18:00'))return'';
 if(!habitsFor(s).some(h=>h.study&&!(o.h&&o.h[h.id])))return'';const w=o.why||{};
 return`<p class="muted">Bloque sin hacer. Anótalo para ver el patrón.</p><label>¿A qué hora decidí no empezar?<input type="time" data-w="time" value="${esc(w.time)}"></label>
 <label>¿Qué lo cortó?<select data-w="cause"><option value="">—</option>${C.causes.map(c=>`<option${w.cause===c?' selected':''}>${c}</option>`).join('')}</select></label>
 <input data-w="other" placeholder="Detalle (opcional)" value="${esc(w.other)}">`};
const woSec=s=>(D(s).wo||[]).map((w,i)=>`<div class="wrow"><span>${esc(w.e)} · ${w.kg} kg · ${w.s}×${w.r}</span><button class="x" data-act="wdel" data-i="${i}" aria-label="Borrar">×</button></div>`).join('');
const tl=s=>{const ad=phase(s)==='Adaptación',L=C.schedule[dow(s)<5?'wk':dow(s)===5?'sat':'sun'],t=nowT();
 let n=-1;if(s===nowD())L.forEach((x,i)=>{if(x.t<=t)n=i});
 return L.map((x,i)=>`<li class="${i===n?'now':''}"><b>${x.t}</b><span>${esc(ad&&x.a?x.a:x.x)}</span></li>`).join('')};
const banner=()=>dow(nowD())===6&&S.lastExport!==nowD()?`<div class="note w">Es domingo: exporta la copia de seguridad. <button class="lnk" data-act="exp">Exportar ahora</button></div>`:'';
function vHoy(){const d=D(cur),t=nowD();
 return`${banner()}<section id="head" class="card">${head(cur)}</section>
 ${cur!==t?`<p class="muted">Viendo ${fmt(cur)}. <button class="lnk" data-act="go" data-d="${t}">Volver a hoy</button></p>`:''}
 <details class="card" open><summary class="muted">Horario</summary><ol class="tl" id="tl" style="margin-top:12px;max-height:300px;overflow-y:auto;position:relative">${tl(cur)}</ol></details>
 <div class="sw"><button data-act="min" aria-pressed="${!!d.min}">Día mínimo</button><span class="muted">${d.min?'Activado':'Para días flojos'}</span></div>
 <section id="list" class="card">${list(cur)}</section>
 <section class="card"><h3>Datos del día</h3><div class="g2">
 <label>Pasos<input type="number" inputmode="numeric" data-f="steps" value="${esc(d.steps)}"></label>
 <label>Min de Shorts<input type="number" inputmode="numeric" data-f="shorts" value="${esc(d.shorts)}"></label>
 <label>Me acosté a las<input type="time" data-f="bed" value="${esc(d.bed)}"></label>
 <label>Peso kg (opcional, 1/semana)<input type="number" step="0.1" inputmode="decimal" data-f="weight" value="${esc(d.weight)}"></label></div></section>
 <section class="card"><h3>Estudio</h3><label>Tarea concreta del bloque<input data-f="task" value="${esc(d.task)}"></label><div id="why">${why(cur)}</div></section>
 <section class="card"><h3>Entreno</h3><div id="wo">${woSec(cur)}</div>
 <div class="chips">${C.exercises.map(e=>`<button data-act="wq" data-e="${e}">${e.split(' ')[0]} +</button>`).join('')}</div>
 <div class="g3"><input id="we" placeholder="Ejercicio"><input id="wkg" type="number" step="0.5" placeholder="kg"><input id="wss" type="number" placeholder="series"><input id="wrr" type="number" placeholder="reps"></div>
 <button class="btn o" data-act="wadd">Añadir</button><p id="wmsg" class="muted" role="alert"></p></section>
 <section class="card"><h3>Inconvenientes y otras cosas que hice</h3><textarea rows="9" data-f="notes">${esc(d.notes)}</textarea></section>`}
function vSemBase(){const ds=weekDays(wk),t=nowD(),s=wstats(ds),w=st_();
 const msg=s.valid>=5?w.win:(ds[6]<t||t>=ds[5])?w.lose:`Llevas ${s.valid} de 5 días válidos`;
 const causes=Object.keys(s.causes).map(k=>`${k}: ${s.causes[k]}`).join(' · ');
 return`
 ${s.alert?`<div class="note w">Dos días seguidos con menos de ${w.relapse} puntos. Hoy toca el día mínimo, sin más.</div>`:''}
 <div class="card wrap"><table><tr><th></th>${ds.map((d,i)=>`<th><button class="lnk" data-act="go" data-d="${d}">${DN[i][0]}<br><small>${d.slice(8)}</small></button></th>`).join('')}</tr>
 ${C.habits.map(h=>`<tr><td>${esc(h.s)}</td>${ds.map(d=>habitsFor(d).includes(h)&&inCh(d)?`<td><button class="cell${D(d).h&&D(d).h[h.id]?' on':''}" data-act="cell" data-d="${d}" data-id="${h.id}" aria-label="${h.s} ${d}"></button></td>`:'<td class="muted">·</td>').join('')}</tr>`).join('')}
 <tr><td>Puntos</td>${ds.map(d=>`<td>${inCh(d)&&d<=t?score(d):''}</td>`).join('')}</tr>
 <tr><td>Estado</td>${ds.map(d=>`<td><span class="dot ${status(d)}"></span></td>`).join('')}</tr></table></div>
 <div class="note">${esc(msg)}</div>
 <section class="card"><h3>Resumen</h3>
 <div class="kv"><span>Días válidos (objetivo 5+)</span><b>${s.valid}</b></div>
 <div class="kv"><span>Días salvados</span><b>${s.saved}</b></div>
 <div class="kv"><span>Bloques de estudio (objetivo 8 de 10)</span><b>${s.study}</b></div>
 <div class="kv"><span>Media de Shorts</span><b>${s.avg===null?'—':s.avg+' min'}</b></div>
 <div class="kv"><span>Mejor dominada con lastre</span><b>${s.pu?`+${s.pu.kg} kg × ${s.pu.r}`:'—'}</b></div>
 <div class="kv"><span>Cama a las 22:30</span><b>${s.bed}</b></div>
 <div class="kv"><span>Causas de bloques fallados</span><b>${causes||'—'}</b></div></section>
 <section class="card"><h3>Notas de la semana</h3><textarea rows="5" data-wn="1">${esc(S.weeks[wk])}</textarea><button class="btn" data-act="copy">Copiar resumen</button></section>`}
function summary(){const ds=weekDays(wk),s=wstats(ds);
 return[`Semana ${fmt(wk)} – ${fmt(add(wk,6))} (Winter Arc)`,`Días válidos: ${s.valid}/7 (objetivo 5) · salvados: ${s.saved}`,
 `Puntos por día: ${ds.map(d=>inCh(d)&&d<=nowD()?score(d):'-').join(' ')}`,`Bloques de estudio: ${s.study}/10 (objetivo 8)`,
 `Shorts, media: ${s.avg===null?'sin datos':s.avg+' min'}`,`Mejor dominada con lastre: ${s.pu?`+${s.pu.kg} kg × ${s.pu.r}`:'sin datos'}`,
 `Cama a las 22:30: ${s.bed}/7`,`Causas de bloques fallados: ${Object.keys(s.causes).map(k=>k+' '+s.causes[k]).join(', ')||'ninguna registrada'}`,
 `Notas: ${S.weeks[wk]||'—'}`].join('\n')}
// ---- gráficos SVG
function bars(vals,max,line){const n=vals.length||1,w=300/n;
 return`<svg class="ch" viewBox="0 0 300 100">${vals.map((v,i)=>v.v==null?'':`<rect class="${v.c||''}" x="${i*w+.5}" y="${90-Math.min(v.v,max)/max*85}" width="${Math.max(w-1,1)}" height="${Math.min(v.v,max)/max*85}" rx="1.5"/>`).join('')}
 ${line!=null?`<line class="ln" x1="0" x2="300" y1="${90-line/max*85}" y2="${90-line/max*85}"/><text x="2" y="${86-line/max*85}">${line}</text>`:''}</svg>`}
function vProBase(){const s=st_(),t=nowD(),tot=diff(s.start,s.end)+1,el=Math.max(0,Math.min(tot,diff(s.start,t)+1));
 let run=0,best=0;for(let d=s.start;d<=s.end&&d<=t;d=add(d,1)){const x=status(d);if(x==='valid'){run++;best=Math.max(best,run)}else if(x!=='saved'&&d<t)run=0}
 const ds=[];for(let d=s.start;d<=s.end&&d<=t;d=add(d,1))ds.push({v:score(d),c:status(d)});
 const wks=[];for(let w=monday(s.start);w<=s.end&&w<=t;w=add(w,7)){const a=wstats(weekDays(w));wks.push({v:a.avg})}
 const pts=[];for(let d=s.start;d<=s.end&&d<=t;d=add(d,1))(D(d).wo||[]).forEach(w=>{if(w.e===PU)pts.push({x:diff(s.start,d)/Math.max(tot-1,1)*290+5,kg:w.kg,r:w.r})});
 const mk=Math.max(30,...pts.map(p=>p.kg)),y=k=>90-k/mk*80;
 return`<section class="card"><h3>Reto</h3><div class="big">${Math.max(0,diff(t,s.end))} días</div><div class="muted">hasta el ${fmt(s.end)}</div><div class="bar" style="margin-top:12px"><div style="width:${el/tot*100}%"></div></div><small style="margin:6px 0 0;display:block">Día ${el} de ${tot}</small></section>
 
 <section class="card"><h3>Shorts por semana (media, min)</h3>${bars(wks,Math.max(120,...wks.map(w=>w.v||0)),s.shortsWk)}</section>
 <section class="card"><h3>Dominadas con lastre</h3><svg class="ch" viewBox="0 0 300 100"><line class="ln" x1="0" x2="300" y1="${y(25)}" y2="${y(25)}"/><text x="2" y="${y(25)-3}">meta +25 kg × 5</text>
 ${pts.length>1?`<polyline class="pl" points="${pts.map(p=>p.x+','+y(p.kg)).join(' ')}"/>`:''}${pts.map(p=>`<circle cx="${p.x}" cy="${y(p.kg)}" r="3"><title>+${p.kg} kg × ${p.r}</title></circle>`).join('')}</svg></section>
 <section class="card"><h3>Rachas de días válidos</h3><div class="kv"><span>Actual</span><b>${run}</b></div><div class="kv"><span>Mejor</span><b>${best}</b></div><p class="muted">Los días salvados mantienen la racha. Un día flojo no borra nada.</p></section>`}
const fld=(k,l,t='text')=>`<label>${l}<input type="${t}" data-s="${k}" value="${esc(S.settings[k])}"></label>`;
function vAju(){return`<section class="card"><h3>Reto</h3>${fld('start','Inicio','date')}${fld('adaptEnd','Fin de Adaptación','date')}${fld('end','Fin','date')}
 <div class="g2">${fld('shortsWk','Límite Shorts L-V (min)','number')}${fld('shortsWe','Límite fin de semana (min)','number')}${fld('validMin','Puntos para día válido','number')}${fld('relapse','Alerta si menos de (pts)','number')}</div><p id="smsg" class="muted" role="alert"></p></section>
 <section class="card"><h3>Semana</h3>${fld('win','Texto con 5+ días válidos')}${fld('lose','Texto con menos de 5')}</section>
 <section class="card"><h3>Copia de seguridad</h3><p class="muted">Borrar los datos del navegador borra todo.${S.lastExport?' Última exportación: '+S.lastExport+'.':''}</p><button class="btn" data-act="exp">Exportar JSON</button> <button class="btn o" data-act="imp">Importar JSON</button></section>
 <section class="card"><h3>Datos</h3><p class="muted">Hábitos y horarios se editan en config.js.</p><button class="btn o" data-act="del">Borrar todos los datos</button></section>`}
// ---- v2: iconos, tema, menú lateral, panel y gráficas (Chart.js)
const IC=p=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON={sun:IC('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),moon:IC('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
 hoy:IC('<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>'),sem:IC('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
 pro:IC('<path d="M18 20V10M12 20V4M6 20v-6"/>'),aju:IC('<circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/>')};
const TK='winterarc:theme',NAV=[['hoy','Hoy'],['sem','Semana'],['pro','Resumen'],['aju','Ajustes']];
const savedTheme=()=>{try{return localStorage.getItem(TK)}catch(e){return null}};
const theme=()=>savedTheme()||(typeof matchMedia!=='undefined'&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
function applyTheme(){document.documentElement.dataset.theme=theme();$('#theme').innerHTML=theme()==='dark'?ICON.sun:ICON.moon}
function toggleTheme(){try{localStorage.setItem(TK,theme()==='dark'?'light':'dark')}catch(e){}applyTheme();render()}
function initUI(){applyTheme();document.querySelector('nav').innerHTML=NAV.map(n=>`<button data-tab="${n[0]}">${ICON[n[0]]}<span>${n[1]}</span></button>`).join('')}
const ST_TXT={valid:'completado',saved:'día salvado',part:'parcial',open:'pendiente',miss:'incompleto',empty:'pendiente'};
// Menú lateral: todos los días a la vez, un clic, estado con punto de color
